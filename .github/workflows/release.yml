# Bump "version" in apps/desktop/package.json, commit, then push the matching tag (0.2.0 → v0.2.0)
# to build the Mac app for Apple silicon and Intel and the Windows installer (windows.yml), and
# attach them to a draft GitHub Release. Review the draft, then publish it.
#
# Publishing is what ships the update: installed copies of Meld read latest-mac.yml from the
# newest published release, offer the update, and download the .zip for their architecture.
# Windows copies do the same with latest.yml and the setup .exe.
# The release notes are what the app shows on its What's New page, so write them for users.
# Self-updating needs signed builds (Squirrel.Mac checks the signature).
#
# Signing and notarization are optional: add these repository secrets to turn them on
# (see electron-builder's docs). Without them the app is unsigned.
#   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    strategy:
      matrix:
        arch: [arm64, x64]
    # Apple silicon runner; the x64 build thins the bundled Postgres to x86_64.
    runs-on: macos-15
    env:
      EXPO_NO_TELEMETRY: 1
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Don't go looking for a signing identity in the keychain when no certificate is given.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # apps/desktop/package.json is the one place the version lives, so dev runs, local builds
      # and releases all show the same number in About Meld.
      - name: Check the tag matches apps/desktop/package.json
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json version $version. Bump the version, commit, and tag v$version."
            exit 1
          fi
      - name: Build the ${{ matrix.arch }} .dmg and update .zip
        working-directory: apps/desktop
        run: |
          node scripts/build.mjs --arch ${{ matrix.arch }}
          npx electron-builder --${{ matrix.arch }} --publish never
          # Each job writes its own latest-mac.yml; the release job merges them.
          mv release/latest-mac.yml release/latest-mac-${{ matrix.arch }}.yml
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac-*.yml
          if-no-files-found: error

  windows:
    uses: ./.github/workflows/windows.yml

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/desktop/scripts
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Merge the update info for both architectures
        run: node apps/desktop/scripts/merge-update-info.mjs out/latest-mac.yml out/latest-mac-arm64.yml out/latest-mac-x64.yml
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            out/*.dmg
            out/*.zip
            out/*.blockmap
            out/latest-mac.yml
            out/*.exe
            out/latest.yml
