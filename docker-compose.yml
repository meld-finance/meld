# `docker compose up -d --build` runs all of Meld: Postgres, and the API serving the web app,
# at http://localhost:8080. Run scripts/setup.sh first to create .env.
#
# Developing locally? Run only the database (`npm run db:up`) and use `npm run dev`.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: meld
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meld}
      POSTGRES_DB: meld
    ports:
      # Bound to localhost only so the DB is not exposed on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - meld-db:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meld -d meld"]
      interval: 5s
      timeout: 5s
      retries: 10

  meld:
    build: { context: . }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      # Inside Docker the database is reached by service name, not 127.0.0.1.
      SANDBOX_DATABASE_URL: postgres://meld:${POSTGRES_PASSWORD:-meld}@db:5432/meld_sandbox
      PRODUCTION_DATABASE_URL: postgres://meld:${POSTGRES_PASSWORD:-meld}@db:5432/meld
      API_HOST: 0.0.0.0
      API_PORT: 8080
      DOCUMENTS_DIR: /data/documents
      # Settings saved from the app (first-run setup, Settings). Values in .env win over it.
      MELD_CONFIG_FILE: /data/config/config.json
    extra_hosts:
      # Lets OLLAMA_URL=http://host.docker.internal:11434 reach Ollama on your computer.
      - "host.docker.internal:host-gateway"
    volumes:
      - meld-documents:/data/documents
      - meld-config:/data/config
    ports:
      # Localhost only. See README before exposing Meld to other devices.
      - "127.0.0.1:${MELD_PORT:-8080}:8080"

volumes:
  meld-db:
  meld-documents:
  meld-config:
