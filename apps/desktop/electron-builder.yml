# `npm run desktop:build` makes dist/mac-<arch>/Meld.app (win-unpacked on Windows); `npm run desktop:dist`
# makes a .dmg (a setup .exe on Windows). Build each on its own platform.
# Signing and notarization happen when CSC_LINK / APPLE_ID etc. are set; otherwise the
# app is unsigned (open it the first time with right-click → Open).
appId: app.meld.desktop
productName: Meld
copyright: Meld contributors (AGPL-3.0)
directories:
  output: release
  buildResources: build
files:
  - dist/main.js
  - dist/preload.cjs
  - build/trayTemplate*.png
  - build/icon.png
  - package.json
  # main.js is bundled; Postgres ships thinned in Resources/postgres and the keyring package in
  # Resources/keyring. Without this,
  # the optional @embedded-postgres package is packed again, unthinned (~320 MB).
  - "!node_modules/**"
extraResources:
  - from: dist/resources
    to: .
    filter: ["**/*"]
asar: true
npmRebuild: false
# Where the app looks for updates (electron-updater reads the latest-mac.yml attached to the newest
# published release). Builds never publish themselves: the release workflow uploads the files.
publish:
  provider: github
  owner: meld-finance
  repo: meld
mac:
  category: public.app-category.finance
  icon: build/icon.png
  # The .dmg is for first installs; the .zip is what the app downloads to update itself.
  target:
    - target: dmg
    - target: zip
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Postgres and the pdfkit package are signed along with the app when signing is set up.
  extendInfo:
    LSUIElement: false
dmg:
  title: Meld
  # Name the arch on every build (electron-builder leaves x64 off by default).
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
